name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          /Volumes/server/projects/draft-betting-v2/scripts/deploy.sh
