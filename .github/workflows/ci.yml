name: Offline checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace client
      - run: npm run build --workspace client
      - name: Isolated auth and socket regression tests
        run: node --test server/tests/*.test.js client/tests/*.test.js
